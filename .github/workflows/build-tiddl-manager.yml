name: Build tiddl-manager

on:
  push:
    branches: [main]
    paths:
      - 'apps/tiddl-manager/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tiddl-manager

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build tiddl base image
        run: |
          git clone --depth 1 https://github.com/oskvr37/tiddl.git /tmp/tiddl
          docker build -t tiddl:3.4.4 /tmp/tiddl

      - name: Build tiddl-manager
        run: |
          cd apps/tiddl-manager
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

---
postgresql_repo:
  codename: bookworm-pgdg
  key_url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
  keyring: "/usr/share/keyrings/pgdg-archive-keyring.gpg"
  repo: "deb [signed-by=/usr/share/keyrings/pgdg-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main"

postgresql_users:
  - name: fresh_rss_user
    password: "{{ vault.database.fresh_rss_user_pw }}"
  - name: n8n_user
    password: "{{ vault.database.n8n_user_pw }}"
  - name: adhd_board_user
    password: "{{ vault.database.adhd_board_user_pw }}"
  - name: openwebui_user
    password: "{{ vault.database.openwebui_user_pw }}"
  - name: mailbot_user
    password: "{{ vault.database.mailbot_user_pw }}"
  - name: evolution_user
    password: "{{ vault.database.evolution_user_pw }}"
  # WARNING: this secret lives in two places and nothing keeps them in sync.
  # The live Tiao bot reads the same password from PGPASSWORD in
  # /root/.hermes/profiles/tiao/.env on the hermes VM, which is NOT managed by
  # Ansible. postgresql_user reconciles the server-side password against the
  # vault on every run, so the moment the two disagree the next
  # `make play-database` resets tiao_user's password to the stale vault value
  # and the bot can no longer open its own ledger. Rotate both together or
  # neither. Nothing fails loudly when this breaks: the only symptom the user's
  # father ever sees is Tião replying "deu ruim, patrão".
  - name: tiao_user
    password: "{{ vault.database.tiao_user_pw }}"
  - name: tiao_web_user
    password: "{{ vault.database.tiao_web_user_pw }}"

postgresql_databases:
  - name: fresh_rss_database
    owner: fresh_rss_user
  - name: n8n_database
    owner: n8n_user
  - name: adhd_board_database
    owner: adhd_board_user
  - name: openwebui_database
    owner: openwebui_user
  - name: mailbot_database
    owner: mailbot_user
  - name: evolution_api
    owner: evolution_user
  - name: tiao_database
    owner: tiao_user

influxdb_databases:
  - name: homeassistant
  - name: localtraefik

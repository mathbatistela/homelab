---
- name: Prepare and install PostgreSQL
  hosts: database
  become: true
  gather_facts: true

  pre_tasks:
    - tags: postgresql_repo_setup

      block:
        - name: Ensure GnuPG is installed (for apt_key)
          ansible.builtin.apt:
            name: gnupg
            state: present

        - name: Add PostgreSQL APT key
          ansible.builtin.apt_key:
            url: "{{ postgresql_repo.key_url }}"
            keyring: "{{ postgresql_repo.keyring }}"
            state: present

        - name: Add PostgreSQL APT repository
          ansible.builtin.apt_repository:
            repo: "{{ postgresql_repo.repo }}"
            filename: pgdg

        - name: Update apt cache
          ansible.builtin.apt:
            update_cache: true

  roles:
    - role: geerlingguy.postgresql
      # Must stay true. With no_log off, the user-reconciliation tasks print
      # every entry of postgresql_users verbatim - eight database passwords,
      # including tiao_user's, which is the credential the live Tião bot uses.
      # That lands in stdout, terminal scrollback and any captured CI or agent
      # log, which would undo the point of keeping them in the vault.
      vars:
        postgres_users_no_log: true

  tags: postgresql_install

- name: Prepare and install InfluxDB
  hosts: database
  become: true
  gather_facts: true

  roles:
    - role: influxdb

  tags: influxdb_install

- name: Prepare and install Redis
  hosts: database
  become: true
  gather_facts: true

  roles:
    - role: geerlingguy.redis

  tags: redis_install

- name: Deploy journal log collection
  hosts: database
  become: true
  gather_facts: true
  roles:
    - role: promtail_journal
      promtail_journal_units:
        - postgresql@17-main.service
        - redis-server.service
  tags: promtail

# tiao_web_user is created by the role above but has no privileges until the
# grants run. Imported here so a clean rebuild via `make play-database` produces
# a usable read-only role instead of one that can log in and read nothing; the
# grants play is idempotent, so running it every time costs nothing.
- import_playbook: database-tiao-grants.yml

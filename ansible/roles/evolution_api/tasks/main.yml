---
- name: Ensure Evolution API data directory exists
  ansible.builtin.file:
    path: "{{ evolution_api_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create docker-compose directory for Evolution API
  ansible.builtin.file:
    path: "{{ evolution_api_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy Evolution API docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ evolution_api_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Copy nginx config for manager (fixes must-revalidate bug)
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ evolution_api_compose_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0644"

- name: Copy anti-ban wrapper script
  ansible.builtin.template:
    src: wrapper.mjs.j2
    dest: "{{ evolution_api_compose_dir }}/wrapper.mjs"
    owner: root
    group: root
    mode: "0644"

- name: Deploy Evolution API using docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ evolution_api_compose_dir }}"
    state: present
    pull: policy

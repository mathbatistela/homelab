---
- name: Install base OS dependencies for Hermes
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - python3
      - python3-venv
      - ripgrep
      - ffmpeg
    state: present
    update_cache: true

- name: Install Hermes agent via official installer (idempotent)
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL {{ hermes_installer_url }} |
      bash -s -- --non-interactive --skip-setup --skip-browser
    creates: "{{ hermes_agent_bin }}"
  environment:
    HERMES_HOME: "{{ hermes_home }}"

- name: Install Playwright Chromium for the agent (best-effort, enables browse tools)
  ansible.builtin.command:
    cmd: "{{ hermes_agent_dir }}/venv/bin/python -m playwright install --with-deps chromium"
    creates: /root/.cache/ms-playwright
  environment:
    HERMES_HOME: "{{ hermes_home }}"
  register: hermes_playwright
  changed_when: hermes_playwright.rc == 0
  failed_when: false
  when: hermes_install_chromium | bool

- name: Clone/update hermes-webui
  ansible.builtin.git:
    repo: "{{ hermes_webui_repo }}"
    dest: "{{ hermes_webui_dir }}"
    version: "{{ hermes_webui_version }}"
    update: true
  notify: Restart hermes-webui

- name: Install hermes-webui systemd unit
  ansible.builtin.template:
    src: hermes-webui.service.j2
    dest: /etc/systemd/system/hermes-webui.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-webui

- name: Enable and start hermes-webui
  ansible.builtin.systemd:
    name: hermes-webui
    enabled: true
    state: started
    daemon_reload: true

# This role owns {{ hermes_home }}/.env only. The per-profile files under
# {{ hermes_home }}/profiles/*/.env are hand-placed and deliberately left alone.
# One of them is coupled to state this repo does manage: profiles/tiao/.env
# holds PGPASSWORD for tiao_user, the same secret declared on the database host
# as vault.database.tiao_user_pw (see
# inventories/local/host_vars/database/postgresql_databases.yml). Nothing keeps
# the two in sync. Editing PGPASSWORD there without updating the vault means the
# next `make play-database` resets the database password back to the stale vault
# value and the Tião bot loses its ledger. Change both together.
- name: Ensure Hermes environment file exists with safe permissions
  ansible.builtin.file:
    path: "{{ hermes_home }}/.env"
    state: touch
    owner: root
    group: root
    mode: "0600"
  changed_when: false

- name: Remove stale system-level hermes-gateway unit if present
  ansible.builtin.file:
    path: /etc/systemd/system/hermes-gateway.service
    state: absent
  notify: Reload systemd

- name: Configure Hermes email gateway environment variables
  ansible.builtin.lineinfile:
    path: "{{ hermes_home }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
    backup: true
  loop:
    - { key: "EMAIL_ADDRESS", value: "{{ hermes_email_address }}" }
    - { key: "EMAIL_PASSWORD", value: "{{ hermes_email_password }}" }
    - { key: "EMAIL_IMAP_HOST", value: "{{ hermes_email_imap_host }}" }
    - { key: "EMAIL_SMTP_HOST", value: "{{ hermes_email_smtp_host }}" }
    - { key: "EMAIL_IMAP_PORT", value: "{{ hermes_email_imap_port }}" }
    - { key: "EMAIL_SMTP_PORT", value: "{{ hermes_email_smtp_port }}" }
    - { key: "EMAIL_POLL_INTERVAL", value: "{{ hermes_email_poll_interval }}" }
    - { key: "EMAIL_ALLOWED_USERS", value: "{{ hermes_email_allowed_users }}" }
    - { key: "EMAIL_HOME_ADDRESS", value: "{{ hermes_email_home_address }}" }
  notify: Restart hermes-gateway user service
  when: hermes_email_enabled | bool

- name: Configure Hermes gateway/platform credentials from vault
  ansible.builtin.lineinfile:
    path: "{{ hermes_home }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
    backup: true
  loop:
    - { key: "TELEGRAM_BOT_TOKEN", value: "{{ hermes_telegram_bot_token }}" }
    - { key: "DISCORD_BOT_TOKEN", value: "{{ hermes_discord_bot_token }}" }
    - { key: "CLAUDIO_DISCORD_BOT_TOKEN", value: "{{ hermes_claudio_discord_bot_token }}" }
    - { key: "JULIUS_DISCORD_BOT_TOKEN", value: "{{ hermes_julius_discord_bot_token }}" }
    - { key: "ELEVENLABS_API_KEY", value: "{{ hermes_elevenlabs_api_key }}" }
    - { key: "MCP_ACTUAL_BUDGET_API_KEY", value: "{{ hermes_mcp_actual_budget_api_key }}" }
    - { key: "DEEPSEEK_API_KEY", value: "{{ hermes_deepseek_api_key }}" }
    - { key: "ACTUAL_BUDGET_TOKEN", value: "{{ hermes_actual_budget_token }}" }
    - { key: "DISCORD_WEBHOOK_URL", value: "{{ hermes_discord_webhook_url }}" }
    - { key: "HERMES_DASHBOARD_BASIC_AUTH_USERNAME", value: "{{ hermes_dashboard_basic_auth_username }}" }
    - { key: "HERMES_DASHBOARD_BASIC_AUTH_PASSWORD", value: "{{ hermes_dashboard_basic_auth_password }}" }
    - { key: "HERMES_DASHBOARD_BASIC_AUTH_SECRET", value: "{{ hermes_dashboard_basic_auth_secret }}" }
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  notify: Restart hermes-gateway user service
  # Guard against blanking a live credential if a vault key is ever missing —
  # only write values we actually have.
  when: item.value | length > 0

# lineinfile's own `backup: true` above only writes a new .env.<timestamp>~
# copy when a line actually changes (unlike the old unconditional
# `cp .env .env.ansible-backup-$(date)` task this replaced, which ran, and
# left a fresh plaintext-secrets copy, on every single play run). Still prune
# old ones so they don't accumulate forever.
- name: Prune old Hermes environment file backups
  ansible.builtin.shell:
    cmd: >-
      find {{ hermes_home }} -maxdepth 1 -name '.env.*~' -printf '%T@ %p\n' |
      sort -rn | tail -n +6 | cut -d' ' -f2- | xargs -r rm -f
  changed_when: false

# Previously deployed by hand (not managed by this role); captured here so a
# rebuild doesn't lose it.
- name: Install hermes-dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: /etc/systemd/system/hermes-dashboard.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hermes-dashboard

- name: Enable and start hermes-dashboard
  ansible.builtin.systemd:
    name: hermes-dashboard
    enabled: true
    state: started
    daemon_reload: true

# Previously staged into place from /tmp by hand; captured here so a rebuild
# doesn't lose it. Uses system python3 (not the hermes venv) — matches how it
# was actually running.
- name: Ensure aiohttp is available for the CloakBrowser proxy
  ansible.builtin.pip:
    name: aiohttp
    state: present
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
  when: cloakbrowser_proxy_enabled | bool

- name: Install CloakBrowser auto-launch CDP proxy script
  ansible.builtin.copy:
    src: cloakbrowser-autoproxy.py
    dest: /usr/local/bin/cloakbrowser-autoproxy.py
    owner: root
    group: root
    mode: "0755"
  notify: Restart cloakbrowser-proxy
  when: cloakbrowser_proxy_enabled | bool

- name: Install cloakbrowser-proxy systemd unit
  ansible.builtin.template:
    src: cloakbrowser-proxy.service.j2
    dest: /etc/systemd/system/cloakbrowser-proxy.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloakbrowser-proxy
  when: cloakbrowser_proxy_enabled | bool

- name: Enable and start cloakbrowser-proxy
  ansible.builtin.systemd:
    name: cloakbrowser-proxy
    enabled: true
    state: started
    daemon_reload: true
  when: cloakbrowser_proxy_enabled | bool


---
- name: "Ensure jdownloader config directory exists"
  ansible.builtin.file:
    path: "{{ jdownloader_config_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Ensure jdownloader download directory exists"
  ansible.builtin.file:
    path: "{{ jdownloader_download_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Ensure jdownloader compose directory exists"
  ansible.builtin.file:
    path: "{{ jdownloader_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Copy jdownloader docker-compose.yml"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jdownloader_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: "Pull and start jdownloader with Docker Compose v2"
  community.docker.docker_compose_v2:
    project_src: "{{ jdownloader_compose_dir }}"
    pull: "always"
    state: present
  become: true

[project]
name = "tiao-web"
version = "0.2.0"
description = "Caderneta do gado — gerenciamento e visualização"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<7",
    "django-unfold>=0.68",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

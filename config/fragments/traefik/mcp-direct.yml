traefik_fragment_services:
  - filename: mcp-direct.yml
    content: |
      http:
        routers:
          mcp-actual-budget-direct:
            rule: "Host(`mcp.{{ traefik_local_domain }}`) && PathPrefix(`/actual-budget`)"
            entryPoints:
              - https
            service: mcp-actual-budget-service
            tls:
              certResolver: {{ traefik_cert_resolver_name }}
            middlewares:
              - strip-mcp-actual-budget
          mcp-evolution-direct:
            rule: "Host(`mcp.{{ traefik_local_domain }}`) && PathPrefix(`/evolution`)"
            entryPoints:
              - https
            service: mcp-evolution-service
            tls:
              certResolver: {{ traefik_cert_resolver_name }}
        middlewares:
          strip-mcp-actual-budget:
            stripPrefix:
              prefixes:
                - "/actual-budget"
        services:
          mcp-actual-budget-service:
            loadBalancer:
              servers:
                - url: "http://{{ hostvars['ai-tools'].ansible_host }}:3010"
          mcp-evolution-service:
            loadBalancer:
              servers:
                - url: "http://{{ hostvars['ai-tools'].ansible_host }}:3020"

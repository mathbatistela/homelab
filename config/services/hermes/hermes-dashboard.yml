service_manifest:
  name: hermes-dashboard
  display_name: Hermes Dashboard
  host: hermes
  service:
    port: 9119
    protocol: http
  exposure:
    local:
      enabled: true
      mode: fragment
      fragment: hermes-dashboard
    public:
      enabled: false
  auth:
    sso: false
  deployment:
    owner: role
    role: hermes

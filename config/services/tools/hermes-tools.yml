service_manifest:
  name: hermes-tools
  display_name: Hermes Tools
  host: tools
  service:
    port: 8092
    protocol: http
  exposure:
    local:
      enabled: true
      mode: fragment
      fragment: hermes-tools
    public:
      enabled: true
      mode: fragment
      fragment: hermes-tools
  auth:
    sso: false
  deployment:
    owner: role
    role: hermes_tools

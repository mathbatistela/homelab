service_manifest:
  name: wedding-rsvp
  display_name: Wedding RSVP (Staging)
  host: tools
  service:
    port: 3000
    protocol: http
  exposure:
    local:
      enabled: true
      mode: generated
      template: simple-http
      subdomain: casamento-gi-jorge.staging
    public:
      enabled: true
      mode: fragment
      fragment: wedding-rsvp
  auth:
    sso: false
  deployment:
    owner: manual
